[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "axion"
version = "0.1.0"
description = "A differentiable, GPU-native finite element framework written in JAX"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["jax", "numpy", "meshio"]

[project.optional-dependencies]
examples = ["matplotlib", "h5py", "gmsh", "pymetis"]

[tool.setuptools]
packages = ["axion"]
